# ============================================================================
# FILE: /etc/nginx/sites-available/chatgpt-proxy.conf
# ============================================================================

map $http_upgrade $connection_upgrade {
    default  upgrade;
    ''       close;
}

map $http_cookie $chatgpt_proxy_ok {
    default 0;
    # OPTIONAL: you can change "secret" cookie name and value below
    # default name is chatgpt
    # default value is proxy
    # IMPORTANT: do NOT change the other characters and keep the equal
    "~*(^|;\s*)chatgpt=proxy($|;)" 1;
}

# ─────────────────────────────────────────────────────────────────────────────
# BLOCK 1 — HTTP → HTTPS redirect (all subdomains)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name FOO.YOURDOMAIN.EXT
                cdn.FOO.YOURDOMAIN.EXT
                auth0.FOO.YOURDOMAIN.EXT
                api.FOO.YOURDOMAIN.EXT
                files.FOO.YOURDOMAIN.EXT
                ab.FOO.YOURDOMAIN.EXT
                prodregistryv2.FOO.YOURDOMAIN.EXT;

    return 301 https://$host$request_uri;
}


# ─────────────────────────────────────────────────────────────────────────────
# BLOCK 2 — FOO.YOURDOMAIN.EXT → chatgpt.com
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name FOO.YOURDOMAIN.EXT;

    ssl_certificate      /etc/letsencrypt/live/FOO.YOURDOMAIN.EXT/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/FOO.YOURDOMAIN.EXT/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;

    sub_filter_once   off;
    sub_filter_types  *;
    sub_filter 'chatgpt.com'              'FOO.YOURDOMAIN.EXT';
    sub_filter 'cdn.oaistatic.com'        'cdn.FOO.YOURDOMAIN.EXT';
    sub_filter 'auth0.openai.com'         'auth0.FOO.YOURDOMAIN.EXT';
    sub_filter 'api.openai.com'           'api.FOO.YOURDOMAIN.EXT';
    sub_filter 'files.oaiusercontent.com' 'files.FOO.YOURDOMAIN.EXT';
    sub_filter 'ab.chatgpt.com'           'ab.FOO.YOURDOMAIN.EXT';
    sub_filter 'prodregistryv2.org'       'prodregistryv2.FOO.YOURDOMAIN.EXT';

    client_max_body_size 100m;

    # To protect the access to the main page from most (serve)
    error_page 403 = /chatgpt-proxy-blocked.html;
    location /chatgpt-proxy-blocked.html {
        internal;
        root /var/www/html;
    }

    location / {
        # To protect the access to the main page from most (detect)
        if ($chatgpt_proxy_ok = 0) {
            return 403;
        }

        proxy_pass https://chatgpt.com;

        proxy_ssl_server_name on;
        proxy_ssl_name        chatgpt.com;

        proxy_set_header Host            chatgpt.com;
        proxy_set_header Origin          https://chatgpt.com;
        proxy_set_header Referer         https://chatgpt.com$request_uri;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";

        proxy_http_version          1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cookie_domain chatgpt.com FOO.YOURDOMAIN.EXT;
        proxy_cookie_path   /           /;
        proxy_cookie_flags  ~           secure samesite=none;

        proxy_redirect https://chatgpt.com/ https://FOO.YOURDOMAIN.EXT/;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;

        proxy_buffer_size       32k;
        proxy_buffers           8 32k;
        proxy_busy_buffers_size 64k;

        proxy_buffering       off;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }
}


